[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "novamac"
dynamic = [
        "version"
]
authors = [
  { name="Connor Stone", email="connorstone628@gmail.com" },
]
description = "Bayesian transient scene modeling"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = [
        "statistics",
        "machine learning",
        "Bayesian",
        "Astronomy",
        "JAX"
]
classifiers=[
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3"
]
dependencies=[
    "astropy>=7.0",
    "caskade>=1.1.0,<1.2.0",
    "matplotlib>=3.7",
    "numpy>=2.0.0,<3",
    "jax>=0.7,<1",
    "astrophot~=0.18",
    "equinox>=0.13,<0.14",
]


[project.urls]
Homepage = "https://github.com/ConnorStoneAstro/novamac"
Documentation = "https://github.com/ConnorStoneAstro/novamac"
Repository = "https://github.com/ConnorStoneAstro/novamac"
Issues = "https://github.com/ConnorStoneAstro/novamac/issues"

[project.optional-dependencies]


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/novamac/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"